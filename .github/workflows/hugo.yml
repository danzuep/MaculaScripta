name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the selected branch to the live GitHub Pages site (replaces the current site)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

# Runs of the same kind on the same branch replace each other, but only PR validation builds are ever cancelled:
# publish (workflow_dispatch) and main-push runs always finish, so a deploy is never lost to a newer PR run.
# The deploy job has its own non-cancelling group.
concurrency:
  group: pages-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pages: read
    env:
      HUGO_VERSION: 0.169.0
      HUGO_ENVIRONMENT: production
      # Only main and publish runs build the whole Old Testament; everything else builds a sample of it.
      HUGO_PARAMS_SAMPLE: ${{ !(github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/hugo-bin"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo-bin" hugo
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Check out Macula Greek TSV (pinned commit, partial and sparse)
        run: |
          # Fetching without blobs and sparsifying before checkout downloads only SBLGNT/tsv.
          commit="$(git rev-parse HEAD:data/macula-greek)"
          url="$(git config -f .gitmodules submodule.data/macula-greek.url)"
          git init -q data/macula-greek
          git -C data/macula-greek remote add origin "${url}"
          git -C data/macula-greek config extensions.partialClone origin
          git -C data/macula-greek sparse-checkout set SBLGNT/tsv
          git -C data/macula-greek fetch -q --depth 1 --filter=blob:none origin "${commit}"
          git -C data/macula-greek checkout -q FETCH_HEAD
      - name: Check out Macula Hebrew TSV (pinned commit, partial and sparse, LFS)
        run: |
          commit="$(git rev-parse HEAD:data/macula-hebrew)"
          url="$(git config -f .gitmodules submodule.data/macula-hebrew.url)"
          git init -q data/macula-hebrew
          git -C data/macula-hebrew remote add origin "${url}"
          git -C data/macula-hebrew config extensions.partialClone origin
          git -C data/macula-hebrew sparse-checkout set WLC/tsv
          git -C data/macula-hebrew fetch -q --depth 1 --filter=blob:none origin "${commit}"
          GIT_LFS_SKIP_SMUDGE=1 git -C data/macula-hebrew checkout -q FETCH_HEAD
          git -C data/macula-hebrew lfs install --local
          git -C data/macula-hebrew lfs pull --include=WLC/tsv/macula-hebrew.tsv
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
        run: |
          export HUGO_PARAMS_BUILDVERSION="$(git rev-parse --short=7 HEAD)"
          hugo \
            --source ./site \
            --destination "${GITHUB_WORKSPACE}/site/public" \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site/public

  deploy:
    if: github.repository == 'danzuep/MaculaScripta' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish))
    concurrency:
      group: github-pages-deployment
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-slim
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
