baseURL = "https://example.github.io/MaculaScripta/"
languageCode = "en"
title = "MaculaScripta"

[params]
rawManuscriptBaseURL = ""
buildVersion = "local"
# true builds only sampleBooks (set HUGO_PARAMS_SAMPLE=true) for fast previews; the full build is the default.
sample = false
sampleBooks = ["JHN", "1JN", "GEN", "RUT"]

[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "data"
target = "data"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "../data/macula-greek/SBLGNT/tsv"
target = "assets/macula"
[[module.mounts]]
source = "../data/macula-hebrew/WLC/tsv"
target = "assets/macula-hebrew"
