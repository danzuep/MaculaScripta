baseURL = "https://example.github.io/MaculaScripta/"
languageCode = "en"
title = "MaculaScripta"

[params]
rawManuscriptBaseURL = ""
buildVersion = "local"
# Sample builds (the default) read the small TSVs in sample/ (John 1 and Haggai 1, see scripts/extract-sample-tsv.mjs)
# and need no submodule. CI sets HUGO_PARAMS_SAMPLE=false for the main branch and for publishing.
sample = true
sampleBooks = ["HAG", "JHN"]
sampleChapters = 1

[[module.mounts]]
source = "content"
target = "content"
[[module.mounts]]
source = "data"
target = "data"
[[module.mounts]]
source = "layouts"
target = "layouts"
[[module.mounts]]
source = "static"
target = "static"
[[module.mounts]]
source = "sample"
target = "assets/sample"
[[module.mounts]]
source = "../data/macula-greek/SBLGNT/tsv"
target = "assets/macula"
[[module.mounts]]
source = "../data/macula-hebrew/WLC/tsv"
target = "assets/macula-hebrew"
