ἐν: in, within, or among
ἀρχή: beginning or origin
εἰμί: to be or exist
ὁ: the; the definite article
λόγος: word, speech, or message
καί: and, also, or even
πρός: toward, to, or with
θεός: God or a god
οὗτος: this; this one
πᾶς: all, every, or the whole
διά: through or by means of
αὐτός: he, she, it; self or same
γίνομαι: to become, happen, or come into being
χωρίς: apart from or without
οὐδέ: and not, nor, or not even
εἷς: one or a single
ὅς: who, which, or that
ζωή: life
φῶς: light
ἄνθρωπος: human being or person
σκοτία: darkness
φαίνω: to shine or appear
οὐ: not; negates a statement
καταλαμβάνω: to grasp, understand, or overcome
