lexicon:
  hos:
    lemma: "ὅς"
    pos: Relative pronoun
    definition: who, which, what, that
    etymology: From Proto-Indo-European *yos, the relative pronoun.
    examples:
      - {text: "ὃς ἦν ἀπ᾽ ἀρχῆς", ref: 1JN 2:13, note: "the one who was from the beginning (cf. ἀπ᾽ ἀρχῆς)"}
  eimi:
    lemma: "εἰμί"
    pos: Verb
    definition: to be, to exist
    etymology: From Proto-Indo-European *h₁es- "to be".
    examples:
      - {text: "ἐν ἀρχῇ ἦν ὁ λόγος", ref: JHN 1:1, note: In the beginning was the Word}
  apo:
    lemma: "ἀπό"
    pos: Preposition
    definition: from, away from (with the genitive)
    etymology: From Proto-Indo-European *h₂epo "off, away".
    examples:
      - {text: "ὃ ἦν ἀπ᾽ ἀρχῆς", ref: 1JN 1:1, note: this very verse}
  arche:
    lemma: "ἀρχή"
    pos: Noun, feminine
    definition: beginning, origin, first place
    etymology: From ἄρχω "to be first, to rule".
    examples:
      - {text: "ἐν ἀρχῇ ἦν ὁ λόγος", ref: JHN 1:1, note: In the beginning was the Word}
  akouo:
    lemma: "ἀκούω"
    pos: Verb
    definition: to hear, to listen
    etymology: From Proto-Indo-European *h₂kows- "to perceive, hear".
    examples:
      - {text: "τὰ πρόβατα τὰ ἐμὰ τῆς φωνῆς μου ἀκούουσιν", ref: JHN 10:27, note: My sheep hear my voice}
  horao:
    lemma: "ὁράω"
    pos: Verb
    definition: to see, to perceive
    etymology: From Proto-Indo-European *wer- "to perceive"; perfect stems use ἑώρακα.
    examples:
      - {text: "ὅτι ἑώρακάς με πεπίστευκας", ref: JHN 20:29, note: Because you have seen me you have believed}
  ho:
    lemma: "ὁ"
    pos: Article
    definition: the (definite article)
    etymology: From Proto-Indo-European demonstrative *so, *seh₂, *tod.
    examples:
      - {text: "ὁ λόγος", ref: JHN 1:1, note: the Word}
  ophthalmos:
    lemma: "ὀφθαλμός"
    pos: Noun, masculine
    definition: eye
    etymology: From Proto-Indo-European *h₃okʷ- "to see" (compare ὄψομαι).
    examples:
      - {text: "ὁ λύχνος τοῦ σώματός ἐστιν ὁ ὀφθαλμός", ref: MAT 6:22, note: The eye is the lamp of the body}
  ego:
    lemma: "ἐγώ"
    pos: Personal pronoun
    definition: I; plural forms mean we, us, our
    etymology: From Proto-Indo-European *h₁eǵ(oH).
    examples:
      - {text: "ἐκ τοῦ πληρώματος αὐτοῦ ἡμεῖς πάντες ἐλάβομεν", ref: JHN 1:16, note: From his fullness we have all received}
  theaomai:
    lemma: "θεάομαι"
    pos: Verb
    definition: to behold, to gaze upon
    etymology: From θέα "a view, sight"; related to θαῦμα "wonder".
    examples:
      - {text: "ἐθεασάμεθα τὴν δόξαν αὐτοῦ", ref: JHN 1:14, note: We have beheld his glory}
  kai:
    lemma: "καί"
    pos: Conjunction
    definition: and, also, even
    etymology: Of uncertain origin; possibly related to Cypriot κάς.
    examples:
      - {text: "καὶ ὁ λόγος ἦν πρὸς τὸν θεόν", ref: JHN 1:1, note: and the Word was with God}
  cheir:
    lemma: "χείρ"
    pos: Noun, feminine
    definition: hand
    etymology: From Proto-Indo-European *ǵʰesr- "hand".
    examples:
      - {text: "ἐκτείνας τὴν χεῖρα ἥψατο αὐτοῦ", ref: MAT 8:3, note: He stretched out his hand and touched him}
  psilaphao:
    lemma: "ψηλαφάω"
    pos: Verb
    definition: to touch, to feel, to handle
    etymology: From ψάω "to rub, touch" with ἁφή "touch".
    examples:
      - {text: "ψηλαφήσατέ με καὶ ἴδετε", ref: LUK 24:39, note: Touch me and see}
  peri:
    lemma: "περί"
    pos: Preposition
    definition: concerning, about (with the genitive)
    etymology: From Proto-Indo-European *per- "around".
    examples:
      - {text: "ἵνα μαρτυρήσῃ περὶ τοῦ φωτός", ref: JHN 1:7, note: to bear witness about the light}
  logos:
    lemma: "λόγος"
    pos: Noun, masculine
    definition: word, message, reason
    etymology: From λέγω "to say, to gather"; Proto-Indo-European *leǵ-.
    examples:
      - {text: "ἐν ἀρχῇ ἦν ὁ λόγος", ref: JHN 1:1, note: In the beginning was the Word}
  zoe:
    lemma: "ζωή"
    pos: Noun, feminine
    definition: life
    etymology: From ζάω "to live"; Proto-Indo-European *gʷih₃- "to live".
    examples:
      - {text: "ἐν αὐτῷ ζωὴ ἦν", ref: JHN 1:4, note: In him was life}
